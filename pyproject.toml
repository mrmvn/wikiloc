[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wikiloc"
version = "0.1.0"
description = "Parse in-source locators (page, pages, chapter, quote, ...) from Wikipedia citation wikitext."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Citation Location Needed Author(s)" }]
keywords = ["wikipedia", "citations", "wikitext", "locators", "verifiability"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
]
# Zero runtime dependencies: the parser uses only the Python standard library.
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["wikiloc", "wikiloc.tests"]
