[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wikiloc"
version = "0.1.0"
description = "Parse in-source locators (page, pages, chapter, quote, ...) from Wikipedia citation wikitext."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Mario Morvan", email = "contact@mariomorvan.com" }]
keywords = ["wikipedia", "citations", "wikitext", "locators", "verifiability"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup",
]
# Zero runtime dependencies: the parser uses only the Python standard library.
dependencies = []

[project.urls]
Homepage = "https://github.com/mrmvn/wikiloc"
Repository = "https://github.com/mrmvn/wikiloc"

[project.optional-dependencies]
test = ["pytest"]
# Reference *extraction* from whole-article wikitext (wikiloc.extract).
extract = ["mwparserfromhell"]

[tool.setuptools]
packages = ["wikiloc", "wikiloc.tests"]
